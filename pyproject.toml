[project]
name = "credit-scorecard"
version = "0.1.0"
description = "Application-style 12-month PD scorecard (WOE/IV binning, logistic regression, points scaling) with out-of-time validation."
readme = "README.md"
authors = [{ name = "Ashwani Tripathi" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
run-scorecard = "scorecard.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
